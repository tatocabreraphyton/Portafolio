<!-- CÓDIGO HTML5 CORREO-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Correo de Contacto | Tato Cabrera</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      position: fixed;
      height: 100vh !important;
      width: 100vw !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;   /* ✅ bloquea scroll global */
    }

    body#paginaCorreo {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #preload {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      overflow: hidden;
    }

    #logoPreload {
      width: 380px;
      opacity: 0;
      filter: drop-shadow(0 0 25px red);
      transform-origin: center center;
      max-height: 100vh;
    }

    /* 📬 Formulario vertical centrado */
    #correo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    #formCorreo {
      transform: translateY(-4.5%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90%;
      max-width: 400px;
      position: relative;
      z-index: 2;
      scale: calc(1.05);
    }

    #formCorreo label {
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-align: left;
    }

    #formCorreo input,
    #formCorreo textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #111;
      color: #fff;
      font-size: 16px;
    }

    #formCorreo button {
      transform: translate(3.03%,3.03%);
      background: #ff0000;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      border: none;
      border-radius: 5px;
      padding: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #formCorreo button:hover {
      background: #ff4500;
    }

    /*==================================================================*/
    /*=================== MARCOS ANIMADOS POR RANGOS ===================*/
    /*==================================================================*/



    #correo h2 {
      transform: translateY(-15px);
      position: relative;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255,0,0,0.8);
    }

    #correo h2::before,
    #correo h2::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38px;
      height: 3.5px;
      background: linear-gradient(90deg, transparent, #ff0000);
      transform: translateY(-50%);
    }

    #correo h2::before { right: 100%; margin-right: 2px; }
    #correo h2::after { left: 100%; margin-left: 2px; background: linear-gradient(90deg, #ff0000, transparent); }

    #touch-ring {
      position: fixed;
      width: 60px;
      height: 60px;
      border: 3px solid rgb(255, 0, 0);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.1s ease-out, opacity 0.1s ease-out;
      background: rgba(255, 0, 0, 0.15);
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      box-shadow: none;
    }
  </style>
</head>

<body id="paginaCorreo">
  <div id="cursor"></div>
  <div id="touch-ring"></div>

  <!-- 🌀 Preload con logo corporativo -->
  <div id="preload">
    <img src="img/TC-DESIGN-3D---2026A.png" alt="TC Design 3D" id="logoPreload">
  </div>

  <!-- 🔥 Chibi independiente encima de la senefa -->
  <div id="bannerAnimado">
    <!-- tus imágenes chibi -->
  </div>

  <!-- Senefas metálicas -->
  <div id="senefaArriba2" class="senefa2" style="opacity:0;">
    <div class="senefa-contenido"><span class="senefaTextoMetal">CORREO DE CONTACTO</span></div>
  </div>
  <div id="senefaAbajo2" class="senefa2" style="opacity:0;">
    <div class="senefa-contenido"><span class="senefaTextoMetal">TATO CABRERA</span></div>
  </div>

  <!-- 📬 Correo -->
  <section id="correo">
    <h2>Envíame tu correo</h2>

    <!-- Marco Animado grande -->
    <div class="marco">
      <img src="video/animacion marco correo gif transparencia.gif" alt="">
    </div>

    <div class="marco1">
  <img src="video/animacion marco correo gif transparencia.gif" alt="">
</div>

    <form id="formCorreo" action="https://formspree.io/f/xlgqknpe" method="POST">
      <label for="nombre">Tu nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Tu correo:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar correo</button>
    </form>
  </section>

  <!-- Scripts externos -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="script.js"></script>

  <!-- Botón enviar correo comportamiento -->
  <script>
    const form = document.getElementById('formCorreo');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);

      const boton = form.querySelector('button');
      boton.textContent = "Enviando...";

      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        window.location.href = "index.html?correo=ok";
      } else {
        boton.textContent = "Error al enviar";
      }
    });
  </script>
</body>
</html>
